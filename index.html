<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="つむぐ園の公式Webサイトは、ただいま公開に向けて準備中です。">
    <title>つむぐ園 | Webサイト準備中</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a class="site-name" href="./" aria-label="つむぐ園 トップページ">
          <span class="site-name__mark" aria-hidden="true">
            <span class="leaf leaf--left"></span>
            <span class="leaf leaf--right"></span>
          </span>
          <span>つむぐ園</span>
        </a>
      </header>

      <main class="main-content">
        <section class="hero" aria-labelledby="page-title">
          <div class="hero__decoration hero__decoration--pink" aria-hidden="true"></div>
          <div class="hero__decoration hero__decoration--green" aria-hidden="true"></div>

          <div class="hero__content">
            <p class="hero__label">Coming Soon</p>
            <h1 id="page-title">つむぐ園 Webサイト</h1>
            <p class="hero__message">ただいま新しいWebサイトを<br class="mobile-break">準備しています。</p>
            <div class="sprout" aria-hidden="true">
              <span class="sprout__leaf sprout__leaf--left"></span>
              <span class="sprout__stem"></span>
              <span class="sprout__leaf sprout__leaf--right"></span>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p>公開までしばらくお待ちください。</p>
        <small>&copy; つむぐ園</small>
      </footer>
    </div>
  </body>
</html>
